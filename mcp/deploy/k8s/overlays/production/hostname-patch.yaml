# Set the public hostname on both HTTPRoutes. Replace mcp.abirechner.de
# with the real host before applying.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: abi-rechner-mcp
spec:
  hostnames:
    - mcp.abirechner.de
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: abi-rechner-mcp-http-redirect
spec:
  hostnames:
    - mcp.abirechner.de
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: abi-rechner-mcp-tls
spec:
  dnsNames:
    - mcp.abirechner.de
